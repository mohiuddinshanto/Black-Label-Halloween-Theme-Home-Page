<!-- ============================================================
  SECTION 7: HOW IT WORKS  (তিন ধাপ)
  Elementor-এ: সেল সেকশনের নিচে নতুন Container → HTML widget → পেস্ট।
  এই Container-এর Advanced → CSS ID তে  how  বসান।
============================================================ -->
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Spectral:wght@400;600&display=swap" rel="stylesheet">

<style>
.mh-how{
  --mh-night:#14091f; --mh-bone:#f1e8d6; --mh-mist:#b9a9d1; --mh-slime:#9be564;
  width:100%; background:var(--mh-night); color:var(--mh-bone); padding:72px 0;
  font-family:Spectral,Georgia,serif; font-size:18px; line-height:1.65;
}
.mh-how *,.mh-how *::before,.mh-how *::after{box-sizing:border-box}
.mh-how-wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.mh-how h2{font-family:'Pirata One',Georgia,serif;font-weight:400;letter-spacing:.02em;line-height:1.08;
  margin:0 0 10px;padding:0;color:var(--mh-bone);font-size:clamp(34px,5vw,52px)}
.mh-how .mh-lead{color:var(--mh-mist);max-width:560px;margin:0 0 38px}
.mh-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
.mh-steps h3{font-family:'Pirata One',Georgia,serif;font-weight:400;letter-spacing:.02em;line-height:1.08;
  font-size:26px;margin:0 0 6px;padding:0;color:var(--mh-slime)}
.mh-steps p{margin:0;color:var(--mh-mist)}
</style>

<div class="mh-how" id="mhHow">
  <div class="mh-how-wrap">
    <h2>How it works</h2>
    <p class="mh-lead">From first sip of worry to a quiet night, in three steps.</p>
    <div class="mh-steps">
      <div><h3>1. Spin the wheel</h3><p>Spin and win discounts, free shipping, or treats!</p></div>
      <div><h3>2. Get your gift</h3><p>Place your order and receive a surprise gift.</p></div>
      <div><h3>3. Enjoy your treat</h3><p>Follow the label and enjoy your purchase.</p></div>
    </div>
  </div>
</div>
